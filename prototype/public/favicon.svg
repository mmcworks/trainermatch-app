<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="tm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#tm-grad)"/>
  <!-- Inner Barbell Icon -->
  <g filter="url(#tm-shadow)">
    <!-- Central Bar -->
    <rect x="19" y="30" width="26" height="4" rx="2" fill="#ffffff"/>
    <!-- Left Collar & Plates -->
    <rect x="14" y="22" width="4" height="20" rx="2" fill="#ffffff"/>
    <rect x="9" y="25" width="4" height="14" rx="2" fill="url(#tm-accent)"/>
    <!-- Right Collar & Plates -->
    <rect x="46" y="22" width="4" height="20" rx="2" fill="#ffffff"/>
    <rect x="51" y="25" width="4" height="14" rx="2" fill="url(#tm-accent)"/>
  </g>
  <!-- Accent Lightning / Pulse Indicator -->
  <circle cx="32" cy="19" r="3.5" fill="#34d399"/>
</svg>
